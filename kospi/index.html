<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스피·코스닥 실시간 뉴스 모니터</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="코스피 모니터">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
 body{font-family:'Malgun Gothic',sans-serif;background:#f4f6f9;margin:0;padding:24px;color:#222}
 #loading{color:#667;font-size:14px;padding:40px 0;text-align:center}
 #fsWrap{position:fixed;inset:0;background:#f4f6f9;z-index:50;display:none;flex-direction:column}
 #fsBar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#2c3e50;color:#fff}
 #fsBar b{font-size:15px}
 #fsBar .hint{font-size:11px;opacity:.75;margin-left:10px}
 #fsBar button{background:#fff;color:#2c3e50;border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
 #fsBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
 #fsBody svg{width:95vw;height:auto;display:block;margin:8px auto}
 @media (max-width:600px){body{padding:12px}#fsBody svg{width:250vw;margin:4px}}
 #installBtn{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:#2c3e50;color:#fff;border:none;border-radius:26px;padding:13px 26px;
  font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.35);
  z-index:40;cursor:pointer}
 #installTip{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}
 #installTip>div{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:480px;background:#fff;border-radius:16px 16px 0 0;
  padding:22px 20px 30px;font-size:15px;line-height:1.7}
 #installTip b{font-size:17px}
 #installTip .close{float:right;border:none;background:#eee;border-radius:8px;
  padding:6px 12px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div id="loading">📡 최신 데이터를 불러오는 중...</div></div>

<div id="fsWrap">
<div id="fsBar"><span><b id="fsTitle"></b><span class="hint">드래그로 이동 · 핀치로 확대 · 타일 터치 시 종목 페이지</span></span>
<button onclick="fsClose()">✕ 닫기</button></div>
<div id="fsBody"></div>
</div>

<button id="installBtn" onclick="installApp()">📲 앱으로 설치</button>
<div id="installTip" onclick="this.style.display='none'">
<div onclick="event.stopPropagation()">
<button class="close" onclick="document.getElementById('installTip').style.display='none'">닫기</button>
<b>📲 앱으로 설치하기</b><br><br>
<span id="tipBody"></span>
</div>
</div>

<script>
var REPO = 'vencent10004-droid/vencent10004-droid.github.io';
var RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/';

function tg(id) {
  var e = document.getElementById(id);
  var open = e.style.display === 'table-row';
  e.style.display = open ? 'none' : 'table-row';
  e.dataset.open = open ? '0' : '1';
}
function showPane(m) {
  document.querySelectorAll('.pane').forEach(function (p) {
    p.style.display = (p.id === 'pane-' + m) ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(function (b) {
    b.className = (b.dataset.m === m) ? 'tab on' : 'tab';
  });
  document.querySelectorAll('div[data-market]').forEach(function (el) {
    el.style.display = (m === 'all' || el.dataset.market === m) ? '' : 'none';
  });
  try { localStorage.setItem('marketTab', m); } catch (e) {}
}
function fsOpen(btn) {
  var svg = btn.closest('.tmwrap').querySelector('svg.tmap');
  var body = document.getElementById('fsBody');
  body.innerHTML = '';
  body.appendChild(svg.cloneNode(true));
  document.getElementById('fsTitle').textContent = btn.dataset.title || '';
  document.getElementById('fsWrap').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function fsClose() {
  document.getElementById('fsWrap').style.display = 'none';
  document.body.style.overflow = '';
}

function extract(t, tag) {
  var a = t.indexOf('<!--' + tag + '-->');
  var b = t.indexOf('<!--/' + tag + '-->');
  return (a > -1 && b > a) ? t.slice(a + tag.length + 7, b) : '';
}
var lastContent = '';
function apply(t) {
  var s = extract(t, 'STYLE');
  var c = extract(t, 'CONTENT');
  if (!c || c === lastContent) return;
  lastContent = c;
  document.getElementById('app').innerHTML = s + c;
  var m = 'all';
  try { m = localStorage.getItem('marketTab') || 'all'; } catch (e) {}
  if (m !== 'all') showPane(m);
}
function load() {
  // 최신 커밋 ID로 직접 조회 (브랜치명 주소의 4~5분 캐시 우회)
  fetch('https://api.github.com/repos/' + REPO + '/branches/data',
        { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { return j.commit.sha; })
    .catch(function () { return 'data'; })  // API 한도 초과 시 브랜치명 폴백
    .then(function (ref) {
      var url = RAW_BASE + ref + '/dashboard.html';
      if (ref === 'data') url += '?t=' + Date.now();
      return fetch(url, { cache: 'no-store' });
    })
    .then(function (r) { return r.text(); })
    .then(apply)
    .catch(function (e) {});
}
load();
setInterval(function () {
  var fs = document.getElementById('fsWrap').style.display === 'flex';
  if (!fs && !document.querySelector("tr.drow[data-open='1']")) load();
}, 75000);
// 앱이 백그라운드에서 돌아올 때 즉시 갱신
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) load();
});
// PWA 설치 요건 (서비스워커 등록)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function (e) {});
}

// ── 원터치 앱 설치 ──────────────────────────────
var deferredPrompt = null;
var ua = navigator.userAgent;
var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                   || window.navigator.standalone === true;
var isKakao = /KAKAOTALK/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone) document.getElementById('installBtn').style.display = 'block';
});

function showTip(html) {
  document.getElementById('tipBody').innerHTML = html;
  document.getElementById('installTip').style.display = 'block';
}

function installApp() {
  if (deferredPrompt) {           // 안드로이드 크롬: 시스템 설치창 바로 표시
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function (r) {
      if (r.outcome === 'accepted') {
        document.getElementById('installBtn').style.display = 'none';
      }
      deferredPrompt = null;
    });
  } else if (isIOS) {
    showTip("사파리 하단의 <b>공유 버튼(⬆)</b>을 누른 뒤<br>" +
            "<b>'홈 화면에 추가'</b>를 선택하세요.<br>" +
            "홈 화면에 '코스피 모니터' 아이콘이 생깁니다.");
  } else {
    showTip("브라우저 메뉴(⋮)에서 <b>'앱 설치'</b> 또는<br>" +
            "<b>'홈 화면에 추가'</b>를 선택하세요.");
  }
}

// 카카오톡 인앱 브라우저: 설치 불가 → 크롬/사파리로 안내
if (isKakao && !isStandalone) {
  var btn = document.getElementById('installBtn');
  btn.style.display = 'block';
  if (isIOS) {
    btn.textContent = '📲 앱 설치는 사파리에서';
    btn.onclick = function () {
      showTip("카카오톡 안에서는 설치할 수 없습니다.<br>" +
              "오른쪽 아래 <b>메뉴(⋮ 또는 ↗)</b> → <b>'Safari로 열기'</b>를 누른 뒤<br>" +
              "공유(⬆) → '홈 화면에 추가'를 선택하세요.");
    };
  } else {
    btn.textContent = '📲 크롬으로 열고 설치';
    btn.onclick = function () {
      location.href = 'intent://vencent10004-droid.github.io/kospi/' +
                      '#Intent;scheme=https;package=com.android.chrome;end';
    };
  }
} else if (!isStandalone && isIOS) {
  // 아이폰 사파리: 수동 설치 안내 버튼
  document.getElementById('installBtn').style.display = 'block';
}
</script>
</body>
</html>
