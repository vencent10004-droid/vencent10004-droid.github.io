<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스피·코스닥 실시간 뉴스 모니터</title>
<style>
 body{font-family:'Malgun Gothic',sans-serif;background:#f4f6f9;margin:0;padding:24px;color:#222}
 #loading{color:#667;font-size:14px;padding:40px 0;text-align:center}
 #fsWrap{position:fixed;inset:0;background:#f4f6f9;z-index:50;display:none;flex-direction:column}
 #fsBar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#2c3e50;color:#fff}
 #fsBar b{font-size:15px}
 #fsBar .hint{font-size:11px;opacity:.75;margin-left:10px}
 #fsBar button{background:#fff;color:#2c3e50;border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
 #fsBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
 #fsBody svg{width:95vw;height:auto;display:block;margin:8px auto}
 @media (max-width:600px){body{padding:12px}#fsBody svg{width:250vw;margin:4px}}
</style>
</head>
<body>
<div id="app"><div id="loading">📡 최신 데이터를 불러오는 중...</div></div>

<div id="fsWrap">
<div id="fsBar"><span><b id="fsTitle"></b><span class="hint">드래그로 이동 · 핀치로 확대 · 타일 터치 시 종목 페이지</span></span>
<button onclick="fsClose()">✕ 닫기</button></div>
<div id="fsBody"></div>
</div>

<script>
var DATA_URL = 'https://raw.githubusercontent.com/vencent10004-droid/vencent10004-droid.github.io/data/dashboard.html';

function tg(id) {
  var e = document.getElementById(id);
  var open = e.style.display === 'table-row';
  e.style.display = open ? 'none' : 'table-row';
  e.dataset.open = open ? '0' : '1';
}
function showPane(m) {
  document.querySelectorAll('.pane').forEach(function (p) {
    p.style.display = (p.id === 'pane-' + m) ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(function (b) {
    b.className = (b.dataset.m === m) ? 'tab on' : 'tab';
  });
  document.querySelectorAll('div[data-market]').forEach(function (el) {
    el.style.display = (m === 'all' || el.dataset.market === m) ? '' : 'none';
  });
  try { localStorage.setItem('marketTab', m); } catch (e) {}
}
function fsOpen(btn) {
  var svg = btn.closest('.tmwrap').querySelector('svg.tmap');
  var body = document.getElementById('fsBody');
  body.innerHTML = '';
  body.appendChild(svg.cloneNode(true));
  document.getElementById('fsTitle').textContent = btn.dataset.title || '';
  document.getElementById('fsWrap').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function fsClose() {
  document.getElementById('fsWrap').style.display = 'none';
  document.body.style.overflow = '';
}

function extract(t, tag) {
  var a = t.indexOf('<!--' + tag + '-->');
  var b = t.indexOf('<!--/' + tag + '-->');
  return (a > -1 && b > a) ? t.slice(a + tag.length + 7, b) : '';
}
var lastContent = '';
function load() {
  fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var s = extract(t, 'STYLE');
      var c = extract(t, 'CONTENT');
      if (!c || c === lastContent) return;
      lastContent = c;
      document.getElementById('app').innerHTML = s + c;
      var m = 'all';
      try { m = localStorage.getItem('marketTab') || 'all'; } catch (e) {}
      if (m !== 'all') showPane(m);
    })
    .catch(function (e) {});
}
load();
setInterval(function () {
  var fs = document.getElementById('fsWrap').style.display === 'flex';
  if (!fs && !document.querySelector("tr.drow[data-open='1']")) load();
}, 60000);
</script>
</body>
</html>
