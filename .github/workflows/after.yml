# 정규장·애프터마켓 비교 대시보드 - 데이터 갱신 루프
# 장 마감 후 시간외 시세(코스피 400 + 코스닥 200)를 약 3분 주기로 수집 → after-data 브랜치 갱신.
# 정규장 중에는 격차가 항상 0이므로 수집하지 않는다 (after_data.mjs 내부 가드).
# → 앱에는 항상 "가장 최근 거래일의 정규장 종가 vs 애프터장" 비교가 유지된다.
name: after-market-dashboard

on:
  schedule:
    # UTC 기준. KST 15:35 시작 → 19:58 종료 (시간외 단일가 16~18시 + NXT 애프터마켓 ~20시)
    - cron: '35 6 * * 1-5'
    # 백업: 첫 cron이 누락/지연될 경우 대비 (KST 16:20, 17:30 재시작 — 진행 중이던 루프는 취소 후 재개)
    - cron: '20 7 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/after.yml', 'after_data.mjs']

concurrency:
  group: after-market
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  data-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 주의: 기존 kospi 루프가 data 브랜치를 단일 커밋으로 강제 푸시하므로
      # 애프터마켓 데이터는 전용 after-data 브랜치를 사용한다 (같은 방식의 단일 커밋 강제 푸시).
      - name: prepare after-data branch
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch after-data "$REPO" datarepo || {
            mkdir -p datarepo && cd datarepo && git init -q -b after-data \
            && git remote add origin "$REPO" && cd ..
          }
          cd datarepo
          git config user.name "after-market-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: data loop
        run: |
          while [ "$(date +%H%M)" -lt 1958 ] && [ "$SECONDS" -lt 20700 ]; do
            node after_data.mjs datarepo/after_data.json || true
            if [ -s datarepo/after_data.json ]; then
              cd datarepo
              git add after_data.json
              if ! git diff --cached --quiet 2>/dev/null || ! git rev-parse -q --verify HEAD >/dev/null 2>&1; then
                if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
                  git commit -q --amend -m "after-market data" || true
                else
                  git commit -q -m "after-market data" || true
                fi
                git push -q --force origin after-data || true
              fi
              cd ..
            fi
            sleep 180
          done
