# 실시간 루프 감시견 v2: 데이터 신선도 기반
# status.txt가 15분 이상 오래됐으면 (루프 사망·예약 누락 등 원인 불문) 재시작
name: kospi-watchdog

on:
  schedule:
    # KST 평일 08:05~19:50, 15분 간격 (UTC 기준)
    - cron: '5,20,35,50 23 * * 0-4'
    - cron: '5,20,35,50 0-10 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write

env:
  TZ: Asia/Seoul

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: check data freshness and restart loop if stale
        run: |
          ts=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/data/status.txt?t=$(date +%s)" \
               | grep -oE '^[0-9T:-]+' | head -1)
          now=$(date +%s)
          last=0
          if [ -n "$ts" ]; then
            last=$(date -d "$ts" +%s 2>/dev/null || echo 0)
          fi
          age=$((now - last))
          echo "마지막 데이터: $ts (경과 ${age}초)"
          if [ "$age" -gt 900 ]; then
            echo "15분 이상 정체 → 루프 재시작"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kospi.yml/dispatches" \
              -d '{"ref":"master"}'
          else
            echo "정상 - 조치 없음"
          fi
