# ?댁뒪쨌怨듭떆: 5遺?二쇨린 ?섏쭛 / ?쒖꽭쨌?덊듃留? 60珥?二쇨린 蹂묐젹 媛깆떊 ??data 釉뚮옖移??몄떆
name: kospi-dashboard

on:
  schedule:
    # UTC 湲곗?. ?ㅼ쟾 ?? KST 07:50 ?쒖옉 ??13:58 醫낅즺 / ?ㅽ썑 ?? 13:50 ??19:58
    - cron: '50 22 * * 0-4'
    - cron: '50 4 * * 1-5'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/kospi.yml']

concurrency:
  group: kospi
  cancel-in-progress: true   # ???≪씠 ?⑤㈃ ?댁쟾 猷⑦봽 援먯껜

permissions:
  contents: write

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8

jobs:
  realtime-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: data 釉뚮옖移?以鍮?(??쒕낫?쑣룹긽???멸퀎??
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch data "$REPO" datarepo || {
            mkdir -p datarepo && cd datarepo && git init -q -b data \
            && git remote add origin "$REPO" && cd ..
          }
          cd datarepo
          git config user.name "kospi-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: ?ㅼ떆媛?猷⑦봽 (5遺?二쇨린 ?섏쭛쨌?몄떆)
        run: python cloud_loop.py
