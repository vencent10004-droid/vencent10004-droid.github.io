# 코스피·코스닥 실시간 대시보드 - 클라우드 실시간 루프 (v3)
# 뉴스·공시: 5분 주기 수집 / 시세·히트맵: 60초 병렬 갱신 → data 브랜치 푸시
name: kospi-dashboard

on:
  schedule:
    # UTC 기준. 오전 잡: KST 07:50 시작 → 13:58 종료 / 오후 잡: 13:50 → 19:58
    - cron: '50 22 * * 0-4'
    - cron: '50 4 * * 1-5'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/kospi.yml']

concurrency:
  group: kospi
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8

jobs:
  realtime-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: prepare data branch
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch data "$REPO" datarepo || {
            mkdir -p datarepo && cd datarepo && git init -q -b data \
            && git remote add origin "$REPO" && cd ..
          }
          cd datarepo
          git config user.name "kospi-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: realtime loop
        run: python cloud_loop.py
