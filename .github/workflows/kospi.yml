name: kospi-dashboard

on:
  schedule:
    # GitHub cron은 UTC 기준. KST 평일 08:00~20:00 커버
    - cron: '*/10 23 * * 0-4'   # KST 월~금 08:00~08:59 (프리마켓)
    - cron: '*/10 0-10 * * 1-5' # KST 월~금 09:00~19:59 (정규장~애프터마켓)
  workflow_dispatch:            # 수동 실행
  push:
    branches: [master]
    paths: ['.github/workflows/kospi.yml']  # 워크플로 변경 시 즉시 1회 실행

concurrency:
  group: kospi
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 당일 수집 상태 복원 (런 간 이어짐)
        uses: actions/cache@v4
        with:
          path: |
            state
            sector_cache.json
          key: kospi-state-${{ github.run_id }}
          restore-keys: kospi-state-

      - run: pip install -r requirements.txt

      - name: 수집·분석·대시보드 생성
        run: python cloud_run.py

      - name: 대시보드 커밋·푸시
        run: |
          git config user.name "kospi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kospi/index.html
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "update kospi dashboard (cloud) [skip ci]"
          for i in 1 2 3; do
            git push && break || { git pull --rebase; sleep 3; }
          done
